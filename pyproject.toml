[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "error-guided-sft-data-selection"
version = "0.5.0"
description = "Controlled evaluation of targeted data selection for LoRA post-training."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "numpy==2.3.2",
  "scipy>=1.11",
  "torch==2.8.0",
  "transformers==4.57.2",
  "datasets==4.4.1",
  "peft==0.18.0",
  "safetensors==0.7.0",
]
train = [
  "torch",
  "transformers",
  "datasets",
  "peft",
  "accelerate",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
